<!doctype html>
<!--
  Play Store feature graphic, 1024×500. Rendered by store/make-feature-graphic.mjs.

  Play crops and overlays this asset on some surfaces — and drops a play button
  dead centre when a promo video is attached — so the artwork keeps its edges
  quiet and its centre free of anything that has to be read.

  Fonts come from the app's own @expo-google-fonts packages, so the graphic is
  set in the same faces as the app.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        font-weight: 800;
        src: url('../node_modules/@expo-google-fonts/plus-jakarta-sans/800ExtraBold/PlusJakartaSans_800ExtraBold.ttf');
      }
      @font-face {
        font-family: 'Manrope';
        font-weight: 600;
        src: url('../node_modules/@expo-google-fonts/manrope/600SemiBold/Manrope_600SemiBold.ttf');
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        width: 1024px;
        height: 500px;
        overflow: hidden;
        position: relative;
        font-family: 'Manrope', sans-serif;
        color: #fff;
        /* gradients.duo, with light thrown from the top-left. */
        background:
          radial-gradient(70% 90% at 12% 0%, rgba(255, 255, 255, 0.22), transparent 60%),
          linear-gradient(135deg, #d63c58, #6e5ac8);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 62px;
        width: 560px;
      }
      .logo {
        width: 190px;
        margin-bottom: 26px;
        opacity: 0.95;
      }
      h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 62px;
        line-height: 1.04;
        letter-spacing: -0.035em;
      }
      p {
        margin-top: 22px;
        font-size: 25px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.88);
        line-height: 1.35;
      }
      .marks {
        display: flex;
        gap: 12px;
        margin-top: 30px;
      }
      .marks span {
        padding: 9px 18px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.16);
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
      }
      .art {
        position: absolute;
        right: 44px;
        top: 96px;
        width: 330px;
        filter: drop-shadow(0 18px 26px rgba(40, 12, 40, 0.28));
      }
      /* Soft brand shapes, kept away from the centre and the edges. */
      .blob {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
      }
      .b1 { width: 260px; height: 260px; right: -60px; bottom: -110px; }
      .b2 { width: 140px; height: 140px; left: 600px; top: -60px; }
    </style>
  </head>
  <body>
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <div class="copy">
      <img class="logo" src="wordmark-white.png" alt="Me&u" />
      <h1>Two people,<br />one place.</h1>
      <p>Daily check-ins, games that settle the small stuff, and every detail worth remembering.</p>
      <div class="marks">
        <span>Check in together</span>
        <span>Play</span>
        <span>Private coach</span>
      </div>
    </div>
    <img class="art" src="../assets/images/success-connect.png" alt="" />
  </body>
</html>
